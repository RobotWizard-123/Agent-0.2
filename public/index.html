<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1117">
    <title>L5-A2-08 · 机房智能管理</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar" aria-label="系统导航">
        <div class="brand-block">
          <div class="brand-monogram" aria-hidden="true">L5</div>
          <div>
            <strong>机房智能管理</strong>
            <span>L5-A2-08 / V0.2</span>
          </div>
        </div>

        <nav class="primary-nav" aria-label="主导航">
          <button type="button" class="nav-button is-active" data-view="overview"><span>01</span>机房总览</button>
          <button type="button" class="nav-button" data-view="agent"><span>02</span>上架 Agent</button>
          <button type="button" class="nav-button" data-view="topology"><span>03</span>链路查询</button>
          <button type="button" class="nav-button" data-view="alarms"><span>04</span>报警诊断</button>
          <button type="button" class="nav-button" data-view="audit"><span>05</span>变更审计</button>
        </nav>

        <div class="sidebar-foot">
          <div id="session-summary" class="session-summary"></div>
          <button type="button" class="text-button" id="logout-button">退出登录</button>
        </div>
      </aside>

      <main class="main-stage">
        <header class="command-header">
          <div>
            <p class="section-kicker">DATACENTER CONTROL / DESIGN-SOURCE</p>
            <h1 id="view-title">机房总览</h1>
          </div>
          <div class="system-strip" id="status-strip" aria-label="系统状态"></div>
        </header>
        <section id="app" class="workspace" aria-live="polite"></section>
      </main>
    </div>

    <section class="login-panel" id="login-panel" aria-labelledby="login-title">
      <form class="login-card" id="login-form">
        <div class="login-schematic" aria-hidden="true">
          <span>JG1</span><i></i><b>L5-A2-08</b><i></i><span>JG2</span>
        </div>
        <p class="section-kicker">REMOTE DEMONSTRATION ACCESS</p>
        <h2 id="login-title">进入机房控制台</h2>
        <p class="login-copy">查看 22 个机柜的容量、链路和变更闭环。管理员可执行演示动作，只读账号仅查看。</p>
        <label class="form-field">用户名<input name="username" autocomplete="username" required value="viewer"></label>
        <label class="form-field">密码<input name="password" type="password" autocomplete="current-password" required></label>
        <p class="form-error" id="login-error" role="alert"></p>
        <button class="primary-button" type="submit">登录控制台</button>
      </form>
    </section>

    <div id="assistant-root"></div>
    <div id="dialog-root"></div>
    <div id="toast-root" class="toast-root" aria-live="assertive"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
